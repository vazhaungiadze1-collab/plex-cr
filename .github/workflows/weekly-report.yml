name: Weekly rate report

# Runs every Monday morning (08:00 Asia/Tbilisi = 04:00 UTC).
# Can also be run manually from the "Actions" tab in GitHub (workflow_dispatch)
# to generate a report immediately instead of waiting for Monday.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: scripts
        run: npm install --omit=dev

      - name: Generate weekly report
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node weekly-report.js
